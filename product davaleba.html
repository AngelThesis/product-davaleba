<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Card</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fff;
      font-family: system-ui, "Segoe UI", sans-serif;
      color: #111827;
    }

    .card {
      width: 100%;
      max-width: 468px;
      overflow: hidden;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgb(0 0 0 / 0.15);
    }

    .media {
      position: relative;
      height: 350px;
      overflow: hidden;
      background: linear-gradient(135deg, #e6e4f5, #f4f3fc);
    }

    .media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .ribbon {
      position: absolute;
      top: 26px;
      left: -48px;
      width: 170px;
      padding: 6px 0;
      background: #000;
      color: #fff;
      font-size: 18px;
      text-align: center;
      transform: rotate(-45deg);
    }

    .body {
      padding: 28px 30px 26px;
    }

    .title {
      font-size: 28px;
      font-weight: 500;
    }

    .rating {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 12px;
    }

    .score {
      padding: 4px 14px;
      border-radius: 6px;
      background: #fef08a;
      font-size: 17px;
    }

    .stars {
      color: #fde047;
      font-size: 28px;
      letter-spacing: 2px;
      line-height: 1;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 24px;
    }

    .price {
      font-size: 44px;
      font-weight: 700;
    }

    .price s {
      margin-left: 4px;
      font-size: 20px;
      font-weight: 400;
    }

    .cart {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 30px;
      border: 0;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      font: inherit;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    .cart svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
